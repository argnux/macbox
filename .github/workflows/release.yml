name: Build and Release macOS App

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build for macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate release tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacBox/Info.plist)
          if [ "$tag_version" != "$app_version" ]; then
            echo "Release tag ($GITHUB_REF_NAME) must match app version ($app_version)."
            exit 1
          fi

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcodebuild \
            -project macbox.xcodeproj \
            -scheme macbox \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            clean \
            build

      - name: Compress .app to .zip
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Release/MacBox.app" \
            "build/release/macbox_${{ github.ref_name }}_arm64.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/release/macbox_${{ github.ref_name }}_arm64.zip
          fail_on_unmatched_files: true
