name: Build and Release macOS App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, for example v2.2.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build for macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MacBox/Info.plist)
          if [ "$tag_version" != "$app_version" ]; then
            echo "Release tag ($RELEASE_TAG) must match app version ($app_version)."
            exit 1
          fi

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcodebuild \
            -project macbox.xcodeproj \
            -scheme macbox \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            clean \
            build

      - name: Compress .app to .zip
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            "build/DerivedData/Build/Products/Release/MacBox.app" \
            "build/release/macbox_${RELEASE_TAG}_arm64.zip"

      - name: Create DMG installer
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir -p build/dmg-root
          cp -R "build/DerivedData/Build/Products/Release/MacBox.app" "build/dmg-root/"
          ln -s /Applications "build/dmg-root/Applications"
          hdiutil create \
            -volname "MacBox ${RELEASE_TAG}" \
            -srcfolder "build/dmg-root" \
            -ov \
            -format UDZO \
            "build/release/macbox_${RELEASE_TAG}_arm64.dmg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            build/release/macbox_${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}_arm64.zip
            build/release/macbox_${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}_arm64.dmg
          fail_on_unmatched_files: true
